<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background:#0F172A; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius:12px; border:1px solid #334155; box-shadow:0 20px 25px -5px rgba(0, 0, 0, 0.5);">
  <defs>
    <linearGradient id="grad-ui" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="grad-api" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="grad-eng" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#7E22CE" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="grad-db" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.95" />
    </linearGradient>
    <filter id="box-shadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 0 L 5 8 L 9 0 z" fill="#38BDF8" />
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="25" y="18" width="1050" height="46" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <text x="45" y="47" fill="#F8FAFC" font-size="18" font-weight="700">High-Level System Architecture</text>
  <text x="350" y="47" fill="#94A3B8" font-size="13">Multi-Tier Delivery Finance OS Infrastructure Topology</text>

  <!-- TIER 1: PRESENTATION TIER (STREAMLIT) -->
  <g transform="translate(25, 75)">
    <rect x="0" y="0" width="1050" height="115" rx="8" fill="#1E293B" fill-opacity="0.7" stroke="#2563EB" stroke-width="1.8" filter="url(#box-shadow)"/>
    <rect x="0" y="0" width="1050" height="28" rx="8" fill="url(#grad-ui)"/>
    <text x="18" y="19" fill="#FFFFFF" font-size="12" font-weight="700">PRESENTATION TIER (Streamlit :8501)</text>

    <!-- Component 1 -->
    <rect x="15" y="38" width="325" height="66" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="38" width="4" height="66" rx="2" fill="#3B82F6"/>
    <text x="28" y="58" fill="#60A5FA" font-size="12" font-weight="700">Executive Dashboard (app.py)</text>
    <text x="28" y="76" fill="#CBD5E1" font-size="11">KPI Banners, Waterfall &amp; Monte Carlo Plots</text>
    <text x="28" y="92" fill="#94A3B8" font-size="10">Multi-tab decision view with Plotly graphics</text>

    <!-- Component 2 -->
    <rect x="362" y="38" width="325" height="66" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <rect x="362" y="38" width="4" height="66" rx="2" fill="#60A5FA"/>
    <text x="375" y="58" fill="#60A5FA" font-size="12" font-weight="700">Intelligence Center (intelligence.py)</text>
    <text x="375" y="76" fill="#CBD5E1" font-size="11">9 Scored Diagnostics &amp; 10 Action Cards</text>
    <text x="375" y="92" fill="#94A3B8" font-size="10">Priority-ranked financial remediation badges</text>

    <!-- Component 3 -->
    <rect x="710" y="38" width="325" height="66" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <rect x="710" y="38" width="4" height="66" rx="2" fill="#93C5FD"/>
    <text x="723" y="58" fill="#60A5FA" font-size="12" font-weight="700">REST Connector (api.py)</text>
    <text x="723" y="76" fill="#CBD5E1" font-size="11">Resilient Python Requests Client</text>
    <text x="723" y="92" fill="#94A3B8" font-size="10">10s timeout, circuit fallback &amp; retry logic</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <line x1="550" y1="190" x2="550" y2="215" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow-flow)"/>

  <!-- TIER 2: API GATEWAY (FASTAPI) -->
  <g transform="translate(25, 218)">
    <rect x="0" y="0" width="1050" height="115" rx="8" fill="#1E293B" fill-opacity="0.7" stroke="#10B981" stroke-width="1.8" filter="url(#box-shadow)"/>
    <rect x="0" y="0" width="1050" height="28" rx="8" fill="url(#grad-api)"/>
    <text x="18" y="19" fill="#FFFFFF" font-size="12" font-weight="700">API GATEWAY (FastAPI :8000 ASGI Application)</text>

    <!-- Gateway 1 -->
    <rect x="15" y="38" width="325" height="66" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="38" width="4" height="66" rx="2" fill="#10B981"/>
    <text x="28" y="58" fill="#34D399" font-size="12" font-weight="700">Core Forecast Endpoints</text>
    <text x="28" y="76" fill="#CBD5E1" font-size="11">GET /forecast/current</text>
    <text x="28" y="92" fill="#94A3B8" font-size="10">5-step deterministic forecast baseline</text>

    <!-- Gateway 2 -->
    <rect x="362" y="38" width="325" height="66" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <rect x="362" y="38" width="4" height="66" rx="2" fill="#34D399"/>
    <text x="375" y="58" fill="#34D399" font-size="12" font-weight="700">Practice Analytics Endpoints</text>
    <text x="375" y="76" fill="#CBD5E1" font-size="11">/analytics/summary, /variance, /backlog</text>
    <text x="375" y="92" fill="#94A3B8" font-size="10">Monthly revenue actuals &amp; BU performance</text>

    <!-- Gateway 3 -->
    <rect x="710" y="38" width="325" height="66" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <rect x="710" y="38" width="4" height="66" rx="2" fill="#6EE7B7"/>
    <text x="723" y="58" fill="#34D399" font-size="12" font-weight="700">Intelligence &amp; Decision Endpoints</text>
    <text x="723" y="76" fill="#CBD5E1" font-size="11">/intelligence/overview, /executive/briefing</text>
    <text x="723" y="92" fill="#94A3B8" font-size="10">POST /scenarios/run (Sensitivity simulation)</text>
  </g>

  <!-- Flow 2 -> 3 -->
  <line x1="550" y1="333" x2="550" y2="358" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow-flow)"/>

  <!-- TIER 3: PRACTICE LOGIC ENGINES -->
  <g transform="translate(25, 360)">
    <rect x="0" y="0" width="1050" height="145" rx="8" fill="#1E293B" fill-opacity="0.7" stroke="#9333EA" stroke-width="1.8" filter="url(#box-shadow)"/>
    <rect x="0" y="0" width="1050" height="28" rx="8" fill="url(#grad-eng)"/>
    <text x="18" y="19" fill="#FFFFFF" font-size="12" font-weight="700">PRACTICE LOGIC ENGINES (Pure Python Services)</text>

    <!-- Engine 1 -->
    <rect x="15" y="38" width="325" height="96" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="38" width="4" height="96" rx="2" fill="#A855F7"/>
    <text x="28" y="58" fill="#C084FC" font-size="12" font-weight="700">Deterministic &amp; Backlog</text>
    <text x="28" y="76" fill="#CBD5E1" font-size="11">* forecast_engine.py (5-Step Algorithm)</text>
    <text x="28" y="94" fill="#CBD5E1" font-size="11">* backlog_engine.py (Committed SOWs)</text>
    <text x="28" y="112" fill="#CBD5E1" font-size="11">* forecast_decomposition.py (Waterfalls)</text>

    <!-- Engine 2 -->
    <rect x="362" y="38" width="325" height="96" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <rect x="362" y="38" width="4" height="96" rx="2" fill="#C084FC"/>
    <text x="375" y="58" fill="#C084FC" font-size="12" font-weight="700">Stochastic &amp; Variance</text>
    <text x="375" y="76" fill="#CBD5E1" font-size="11">* monte_carlo_engine.py (5,000 Iterations)</text>
    <text x="375" y="94" fill="#CBD5E1" font-size="11">* variance_engine.py (Budget Bridges)</text>
    <text x="375" y="112" fill="#CBD5E1" font-size="11">* scenario_engine.py (Parameter Shocks)</text>

    <!-- Engine 3 -->
    <rect x="710" y="38" width="325" height="96" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <rect x="710" y="38" width="4" height="96" rx="2" fill="#E9D5FF"/>
    <text x="723" y="58" fill="#C084FC" font-size="12" font-weight="700">Reasoning &amp; Recommendations</text>
    <text x="723" y="76" fill="#CBD5E1" font-size="11">* finance_reasoning.py (20+ Ratios)</text>
    <text x="723" y="94" fill="#CBD5E1" font-size="11">* insight_engine.py (9 Scored Rules)</text>
    <text x="723" y="112" fill="#CBD5E1" font-size="11">* recommendation_engine.py (10 Actions)</text>
  </g>

  <!-- Flow 3 -> 4 -->
  <line x1="550" y1="505" x2="550" y2="528" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow-flow)"/>

  <!-- TIER 4: PERSISTENCE (POSTGRESQL / SQLITE) -->
  <g transform="translate(25, 532)">
    <rect x="0" y="0" width="1050" height="130" rx="8" fill="#1E293B" fill-opacity="0.7" stroke="#475569" stroke-width="1.8" filter="url(#box-shadow)"/>
    <rect x="0" y="0" width="1050" height="28" rx="8" fill="url(#grad-db)"/>
    <text x="18" y="19" fill="#FFFFFF" font-size="12" font-weight="700">PERSISTENCE TIER (PostgreSQL 14+ / SQLite Zero-Config Fallback)</text>

    <!-- DB Columns -->
    <rect x="15" y="38" width="240" height="82" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="28" y="58" fill="#38BDF8" font-size="11" font-weight="700">Practice &amp; Projects</text>
    <text x="28" y="76" fill="#CBD5E1" font-size="11">* business_units (BU ID, Name)</text>
    <text x="28" y="94" fill="#CBD5E1" font-size="11">* projects (SOW, Rates, Hours)</text>

    <rect x="272" y="38" width="240" height="82" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="285" y="58" fill="#38BDF8" font-size="11" font-weight="700">Commercial Pipeline</text>
    <text x="285" y="76" fill="#CBD5E1" font-size="11">* project_pipeline (Snapshots)</text>
    <text x="285" y="94" fill="#CBD5E1" font-size="11">* Probability, Value, Stage</text>

    <rect x="530" y="38" width="240" height="82" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="543" y="58" fill="#38BDF8" font-size="11" font-weight="700">Delivered Actuals</text>
    <text x="543" y="76" fill="#CBD5E1" font-size="11">* project_actuals (Monthly)</text>
    <text x="543" y="94" fill="#CBD5E1" font-size="11">* Revenue, Hours, Labor Costs</text>

    <rect x="788" y="38" width="247" height="82" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="801" y="58" fill="#38BDF8" font-size="11" font-weight="700">Budgets &amp; Forecasts</text>
    <text x="801" y="76" fill="#CBD5E1" font-size="11">* budgets (Revenue, Hours Target)</text>
    <text x="801" y="94" fill="#CBD5E1" font-size="11">* forecast_versions &amp; values</text>
  </g>
</svg>
