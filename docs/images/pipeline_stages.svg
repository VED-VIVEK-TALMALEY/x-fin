<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" width="100%" height="100%" style="background:#0F172A; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius:12px; border:1px solid #334155; box-shadow:0 20px 25px -5px rgba(0, 0, 0, 0.5);">
  <defs>
    <filter id="pl-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow-pl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8" />
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="25" y="15" width="1050" height="38" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
  <text x="45" y="40" fill="#F8FAFC" font-size="16" font-weight="700">Commercial Pipeline Stage Progression &amp; Win Probability Calibration</text>
  <text x="650" y="40" fill="#94A3B8" font-size="12">Stage Gate Weights &amp; Backlog Classification</text>

  <!-- STAGE 1: PROSPECT -->
  <g transform="translate(25, 68)">
    <rect x="0" y="0" width="220" height="135" rx="8" fill="#1E293B" stroke="#D97706" stroke-width="1.8" filter="url(#pl-shadow)"/>
    <rect x="0" y="0" width="220" height="26" rx="8" fill="#78350F"/>
    <text x="12" y="18" fill="#FDE68A" font-size="11" font-weight="700">1. PROSPECT</text>
    <text x="12" y="48" fill="#FBBF24" font-size="12" font-weight="700">Win Rate: 15% (0.15)</text>
    <text x="12" y="68" fill="#CBD5E1" font-size="11">Classification:</text>
    <text x="12" y="86" fill="#FDE68A" font-size="11">Uncommitted Pipeline</text>
    <text x="12" y="112" fill="#94A3B8" font-size="10">Probability-weighted in Gross</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="245" y1="135" x2="275" y2="135" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow-pl)"/>

  <!-- STAGE 2: QUALIFIED -->
  <g transform="translate(285, 68)">
    <rect x="0" y="0" width="220" height="135" rx="8" fill="#1E293B" stroke="#EA580C" stroke-width="1.8" filter="url(#pl-shadow)"/>
    <rect x="0" y="0" width="220" height="26" rx="8" fill="#9A3412"/>
    <text x="12" y="18" fill="#FFEDD5" font-size="11" font-weight="700">2. QUALIFIED</text>
    <text x="12" y="48" fill="#FB923C" font-size="12" font-weight="700">Win Rate: 35% (0.35)</text>
    <text x="12" y="68" fill="#CBD5E1" font-size="11">Classification:</text>
    <text x="12" y="86" fill="#FFEDD5" font-size="11">Uncommitted Pipeline</text>
    <text x="12" y="112" fill="#94A3B8" font-size="10">Target of Executive Closing Surge</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="505" y1="135" x2="535" y2="135" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrow-pl)"/>

  <!-- STAGE 3: IN DELIVERY -->
  <g transform="translate(545, 68)">
    <rect x="0" y="0" width="220" height="135" rx="8" fill="#1E293B" stroke="#2563EB" stroke-width="1.8" filter="url(#pl-shadow)"/>
    <rect x="0" y="0" width="220" height="26" rx="8" fill="#1E3A8A"/>
    <text x="12" y="18" fill="#DBEAFE" font-size="11" font-weight="700">3. IN DELIVERY</text>
    <text x="12" y="48" fill="#60A5FA" font-size="12" font-weight="700">Win Rate: 75% (0.75)</text>
    <text x="12" y="68" fill="#CBD5E1" font-size="11">Classification:</text>
    <text x="12" y="86" fill="#60A5FA" font-size="11">Committed Backlog</text>
    <text x="12" y="112" fill="#94A3B8" font-size="10">Delivering active billable hours</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="765" y1="135" x2="795" y2="135" stroke="#34D399" stroke-width="2.5" marker-end="url(#arrow-pl)"/>

  <!-- STAGE 4: CLOSED WON -->
  <g transform="translate(805, 68)">
    <rect x="0" y="0" width="270" height="135" rx="8" fill="#1E293B" stroke="#16A34A" stroke-width="2" filter="url(#pl-shadow)"/>
    <rect x="0" y="0" width="270" height="26" rx="8" fill="#065F46"/>
    <text x="12" y="18" fill="#D1FAE5" font-size="11" font-weight="700">4. CLOSED WON (SIGNED SOW)</text>
    <text x="12" y="48" fill="#34D399" font-size="12" font-weight="700">Win Rate: 100% (1.00)</text>
    <text x="12" y="68" fill="#CBD5E1" font-size="11">Classification: Committed Backlog Anchor</text>
    <text x="12" y="88" fill="#6EE7B7" font-size="11">100% Face Value locked into Forecast</text>
    <text x="12" y="112" fill="#A7F3D0" font-size="10">Contractually executed Statement of Work</text>
  </g>
</svg>
