services:
  - type: web
    name: x-fin-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/bootstrap_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: x-fin-db
          property: connectionString
      - key: ENVIRONMENT
        value: production

databases:
  - name: x-fin-db
